name: Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore Dependencies
        run: dotnet restore NumberConversions.sln

      - name: Build Solution
        run: dotnet build NumberConversions.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test tests/NumberConversions.Tests/NumberConversions.Tests.csproj --configuration Release --no-build --verbosity normal

name: Publish Paratext Plugin Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref }}".Substring(11)
          } else {
            $tag = "${{ github.event.inputs.version }}"
          }
          Write-Output "VERSION=$tag" >> $env:GITHUB_ENV

      - name: Restore Dependencies
        run: dotnet restore NumberConversions.sln

      - name: Build Release
        run: dotnet build NumberConversions.sln --configuration Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Run Tests
        run: dotnet test tests/NumberConversions.Tests/NumberConversions.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Package Plugin Distribution
        shell: pwsh
        run: |
          $packageDir = "dist/package/NumberConversions"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          
          # Copy plugin binaries
          Copy-Item -Path "src/NumberConversions.Plugin/bin/Release/net48/NumberConversions.ptxplg" -Destination $packageDir -Force
          Copy-Item -Path "src/NumberConversions.Core/bin/Release/net48/NumberConversions.Core.dll" -Destination $packageDir -Force
          
          # Copy installation script and docs
          Copy-Item -Path "scripts/install-plugin.ps1" -Destination $packageDir -Force
          Copy-Item -Path "README.md" -Destination $packageDir -Force
          Copy-Item -Path "LICENSE" -Destination $packageDir -Force
          
          # Create zip archive
          $zipPath = "dist/NumberConversions-Paratext9-Plugin-v${{ env.VERSION }}.zip"
          Compress-Archive -Path "$packageDir/*" -DestinationPath $zipPath -Force
          Write-Host "Created release archive at $zipPath"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', env.VERSION) }}
          name: Number Conversions Paratext Plugin v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/NumberConversions-Paratext9-Plugin-v${{ env.VERSION }}.zip
            src/NumberConversions.Plugin/bin/Release/net48/NumberConversions.ptxplg
            src/NumberConversions.Core/bin/Release/net48/NumberConversions.Core.dll

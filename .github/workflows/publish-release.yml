name: Publish Paratext Plugin Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref }}".Substring(11)
          } else {
            $tag = "${{ github.event.inputs.version }}"
          }
          Write-Output "VERSION=$tag" >> $env:GITHUB_ENV

      - name: Restore NuGet Packages
        run: nuget restore NumberConversions.sln -Verbosity detailed
        continue-on-error: true

      - name: Build Release
        run: msbuild NumberConversions.sln /p:Configuration=Release /p:Platform="Any CPU" /p:Version=${{ env.VERSION }}

      - name: Package Plugin Distribution
        shell: pwsh
        run: |
          $distDir = "dist/NumberConversions"
          New-Item -ItemType Directory -Force -Path $distDir
          
          # Copy compiled output as .ptxplg
          Copy-Item -Path "src/NumberConversions/bin/Release/NumberConversions.dll" -Destination "$distDir/NumberConversions.ptxplg" -Force
          if (Test-Path "src/NumberConversions/bin/Release/NumberConversions.pdb") {
            Copy-Item -Path "src/NumberConversions/bin/Release/NumberConversions.pdb" -Destination "$distDir/" -Force
          }
          
          # Copy documentation & license
          Copy-Item -Path "README.md" -Destination "$distDir/" -Force
          Copy-Item -Path "LICENSE" -Destination "$distDir/" -Force
          
          # Create zip archive
          Compress-Archive -Path "$distDir/*" -DestinationPath "dist/NumberConversions-Paratext9-Plugin-v${{ env.VERSION }}.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', env.VERSION) }}
          name: Number Conversions Paratext Plugin v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/NumberConversions-Paratext9-Plugin-v${{ env.VERSION }}.zip
            dist/NumberConversions/NumberConversions.ptxplg
